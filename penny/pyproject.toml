[project]
name = "penny"
version = "0.1.0"
description = "A simple, local-first AI agent that communicates via Signal"
authors = [{ name = "Jared Lockhart" }]
requires-python = ">=3.14"
dependencies = [
    "websockets>=13.0",
    "httpx[http2]>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "sqlmodel>=0.0.14",
    "discord.py>=2.6.4",
    # openai 3.0.0 moved the SDK onto httpx 2.x, which ships as its own distribution
    # (`httpx2`) — so it installs alongside our `httpx[http2]` 0.28 instead of upgrading
    # it, and the environment carries two unrelated httpx module trees. The SDK's public
    # types then annotate `httpx2.Response`/`httpx2.Request` while everything we hand it
    # is an `httpx.Response`/`httpx.Request`: CI went red on untouched files, and the
    # mismatch is real at runtime too (the timeout object we pass `AsyncOpenAI`, the
    # responses we build its exceptions from). Capped below 3 until Penny moves to
    # httpx 2.x wholesale. See #1877.
    "openai>=1.50.0,<3",
    "dateparser>=1.2.0",
    "timezonefinder>=6.5.0",
    "geopy>=2.4.0",
    "pytz>=2024.1",
    "PyJWT[crypto]>=2.8.0",
    "numpy>=2.0.0",
    "python-dateutil>=2.9.0",

]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff==0.15.18",
    "ty==0.0.52",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "aiohttp>=3.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "N815",  # camelCase field names required by Signal API
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["penny/tests"]
markers = [
    "eval: live-model contract tests — slow, need a running Ollama; excluded from make check, run via make eval",
    "bare_db: use a schema-only test DB (no migration-seeded rows) — for low-level store tests",
]

[tool.ty.environment]
python = "/usr/local/bin/python"

[tool.ty.rules]
unresolved-import = "ignore"
call-non-callable = "warn"
# A call to an attribute or method that doesn't exist is a real defect, so it
# fails the gate. The noisy family that used to justify downgrading this — a
# SQLModel/SQLAlchemy column descriptor (.desc(), .asc(), .in_(), …), which ty
# sees as the field's plain Python type — is fixed AT SOURCE with sqlmodel.col()
# rather than hidden here: a global downgrade also hid a real deleted-method call
# for days. Reach for col(), or a narrow `# ty: ignore[unresolved-attribute]` with
# a reason — never this severity.
unresolved-attribute = "error"
