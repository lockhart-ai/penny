name: client-check

# merge_group does not support paths filters, so the merge-queue path detects
# relevant changes itself: a small detect job on ubuntu-latest diffs the
# merge group against its base, and the macOS build job runs only when
# penny-client, this gate's own script (scripts/client-check.sh), or this
# workflow file is touched — so a change to the gate itself is proven by the
# gate, not waved through by the noop twin. Detection runs on Linux BEFORE the
# macOS runner is requested, so a scarce macOS runner is never held for a PR
# touching none of those — a skipped required job counts as passed, so the
# queue proceeds. The push/pull_request paths filters above and the
# client-check-noop twin's paths-ignore must name the same set of paths as
# this detect step, or a change to one of them trips neither the real job nor
# the noop.
on:
  push:
    branches: [main]
    paths: ["penny-client/**", "scripts/client-check.sh", ".github/workflows/client-check.yml"]
  pull_request:
    branches: [main]
    paths: ["penny-client/**", "scripts/client-check.sh", ".github/workflows/client-check.yml"]
  merge_group:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      client-changed: ${{ steps.detect.outputs.client-changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the merge group's base_sha is present to diff against
          fetch-depth: 0

      - name: Detect penny-client changes
        id: detect
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "merge_group" ]; then
            echo "client-changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "${{ github.event.merge_group.base_sha }}"
          if git diff --name-only "${{ github.event.merge_group.base_sha }}" HEAD -- penny-client/ scripts/client-check.sh .github/workflows/client-check.yml | grep -q .; then
            echo "client-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "client-changed=false" >> "$GITHUB_OUTPUT"
          fi

  client-check:
    needs: detect
    if: needs.detect.outputs.client-changed == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          if ls -d /Applications/Xcode_26*.app >/dev/null 2>&1; then
            sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          fi
          xcodebuild -version

      - run: make client-check